services:
  arcee:
    build:
      context: ../..
      dockerfile: arcee/Dockerfile
    environment:
      ARCEE_ENV: local
      ARCEE_HTTP_ADDR: :8081
      ARCEE_GRPC_ADDR: :9091
    ports:
      - "8081:8081"
      - "9091:9091"

  laserbeak:
    build:
      context: ../..
      dockerfile: laserbeak/Dockerfile
    environment:
      LASERBEAK_ENV: local
      LASERBEAK_HTTP_ADDR: :8080
      ARCEE_GRPC_ADDR: arcee:9091
    depends_on:
      - arcee
    ports:
      - "8080:8080"

  soundwave:
    build:
      context: ../..
      dockerfile: soundwave/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - laserbeak
    ports:
      - "5173:5173"
