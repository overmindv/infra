name: overmindv-production

x-service: &service
  platform: linux/amd64
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cpus: 0.75
  mem_limit: 256m
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-job: &job
  <<: *service
  restart: "no"
  mem_limit: 384m

x-postgres: &postgres
  <<: *service
  image: ${RELEASE_POSTGRES_IMAGE:?release manifest required}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
    interval: 2s
    timeout: 3s
    retries: 30

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_INITDB_ARGS: "--auth-local=peer --auth-host=scram-sha-256"

x-postgres-mount: &postgres-mount
  type: bind
  source: ./deploy/postgres/init-roles.sql
  target: /docker-entrypoint-initdb.d/20-roles.sql
  read_only: true
  bind:
    create_host_path: false

x-db-grants: &db-grants
  <<: *job
  image: ${RELEASE_POSTGRES_IMAGE:?release manifest required}
  user: postgres
  mem_limit: 48m
  entrypoint: ["psql", "-X", "-w", "-v", "ON_ERROR_STOP=1", "-f", "/app/runtime-grants.sql"]
  volumes:
    - type: bind
      source: ./deploy/postgres/runtime-grants.sql
      target: /app/runtime-grants.sql
      read_only: true
      bind:
        create_host_path: false

x-db-grants-env: &db-grants-env
  PGUSER: overmind_migrator
  PGCONNECT_TIMEOUT: "5"
  PGOPTIONS: "-c statement_timeout=10000"

services:
  catalog-bootstrap: !reset null
  kafka-ui: !reset null
  gojudge: !reset null
  gojudge-compiler: !reset null

  kafka:
    <<: *service
    image: ${RELEASE_KAFKA_IMAGE:?release manifest required}
    cpus: 1.5
    mem_limit: 1536m
    ports: !reset []
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  kafka-topics:
    <<: *job
    image: ${RELEASE_KAFKA_IMAGE:?release manifest required}
    volumes: !override
      - type: bind
        source: ./scripts/kafka
        target: /opt/overmind/kafka
        read_only: true
        bind:
          create_host_path: false
    environment:
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx192m"

  users-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: users
      POSTGRES_PASSWORD: ${USERS_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${USERS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${USERS_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - *postgres-mount

  entities-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: entities
      POSTGRES_PASSWORD: ${ENTITIES_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${ENTITIES_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${ENTITIES_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - *postgres-mount

  tasks-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: tasks
      POSTGRES_PASSWORD: ${TASKS_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${TASKS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${TASKS_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - *postgres-mount

  feed-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: feed
      POSTGRES_PASSWORD: ${FEED_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${FEED_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${FEED_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - *postgres-mount

  task-hunter-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: task_hunter
      POSTGRES_PASSWORD: ${TASK_HUNTER_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${TASK_HUNTER_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${TASK_HUNTER_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - *postgres-mount

  recommendations-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: recommendations
      POSTGRES_PASSWORD: ${RECOMMENDATIONS_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${RECOMMENDATIONS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${RECOMMENDATIONS_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - *postgres-mount

  content-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: content
      POSTGRES_PASSWORD: ${CONTENT_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${CONTENT_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${CONTENT_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - *postgres-mount

  media-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: media
      POSTGRES_PASSWORD: ${MEDIA_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${MEDIA_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${MEDIA_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - *postgres-mount

  users-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: users-postgres
      PGDATABASE: users
      PGPASSWORD: ${USERS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      users-migrate:
        condition: service_completed_successfully

  entities-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: entities-postgres
      PGDATABASE: entities
      PGPASSWORD: ${ENTITIES_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      entities-migrate:
        condition: service_completed_successfully

  tasks-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: tasks-postgres
      PGDATABASE: tasks
      PGPASSWORD: ${TASKS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      tasks-migrate:
        condition: service_completed_successfully

  feed-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: feed-postgres
      PGDATABASE: feed
      PGPASSWORD: ${FEED_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      feed-migrate:
        condition: service_completed_successfully

  task-hunter-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: task-hunter-postgres
      PGDATABASE: task_hunter
      PGPASSWORD: ${TASK_HUNTER_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      task-hunter-migrate:
        condition: service_completed_successfully

  recommendations-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: recommendations-postgres
      PGDATABASE: recommendations
      PGPASSWORD: ${RECOMMENDATIONS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      recommendations-migrate:
        condition: service_completed_successfully

  content-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: content-postgres
      PGDATABASE: content
      PGPASSWORD: ${CONTENT_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      content-migrate:
        condition: service_completed_successfully

  media-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: media-postgres
      PGDATABASE: media
      PGPASSWORD: ${MEDIA_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      media-migrate:
        condition: service_completed_successfully

  sandbox-grants:
    <<: *db-grants
    environment:
      <<: *db-grants-env
      PGHOST: sandbox-postgres
      PGDATABASE: sandbox
      PGPASSWORD: ${SANDBOX_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
    depends_on:
      sandbox-migrate:
        condition: service_completed_successfully

  users-migrate:
    <<: *job
    build: !reset null
    image: ${RELEASE_USERS_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_migrator:${USERS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}@users-postgres:5432/users?sslmode=disable

  users-no-demo:
    <<: *job
    image: ${RELEASE_POSTGRES_IMAGE:?release manifest required}
    user: postgres
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        result=$$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT EXISTS (
          SELECT 1 FROM users
          WHERE id BETWEEN '00000000-0000-0000-0000-000000000001'::uuid
                       AND '00000000-0000-0000-0000-000000000010'::uuid
             OR email IN (
               SELECT 'demo-' || n || '@example.invalid' FROM generate_series(1, 10) AS n
             )
        )")
        if [ "$$result" != f ]; then
          printf '%s\n' 'Demo accounts found. Use a clean production database.' >&2
          exit 1
        fi
    environment:
      PGHOST: users-postgres
      PGUSER: overmind_app
      PGDATABASE: users
      PGPASSWORD: ${USERS_POSTGRES_PASSWORD:?production database password required}
      PGCONNECT_TIMEOUT: "5"
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=5000"
    depends_on:
      users-grants:
        condition: service_completed_successfully

  users:
    <<: *service
    build: !reset null
    image: ${RELEASE_USERS_IMAGE:?release manifest required}
    mem_limit: 768m
    environment:
      DATABASE_URL: postgres://overmind_app:${USERS_POSTGRES_PASSWORD:?production database password required}@users-postgres:5432/users?sslmode=disable
      ENV: production
      BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:?production administrator email required}
      MEDIA_USERS_TOKEN: ${MEDIA_USERS_TOKEN:?production service token required}
    depends_on:
      users-grants:
        condition: service_completed_successfully
      users-no-demo:
        condition: service_completed_successfully

  entities-migrate:
    <<: *job
    build: !reset null
    image: ${RELEASE_ENTITIES_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_migrator:${ENTITIES_POSTGRES_MIGRATOR_PASSWORD:?production database password required}@entities-postgres:5432/entities?sslmode=disable

  entities:
    <<: *service
    build: !reset null
    image: ${RELEASE_ENTITIES_IMAGE:?release manifest required}
    ports: !reset []
    environment:
      DATABASE_URL: postgres://overmind_app:${ENTITIES_POSTGRES_PASSWORD:?production database password required}@entities-postgres:5432/entities?sslmode=disable
      ENV: production
    depends_on:
      entities-grants:
        condition: service_completed_successfully

  tasks-migrate:
    <<: *job
    build: !reset null
    image: ${RELEASE_TASKS_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_migrator:${TASKS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}@tasks-postgres:5432/tasks?sslmode=disable

  tasks:
    <<: *service
    build: !reset null
    image: ${RELEASE_TASKS_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_app:${TASKS_POSTGRES_PASSWORD:?production database password required}@tasks-postgres:5432/tasks?sslmode=disable
      ENV: production
    depends_on:
      tasks-grants:
        condition: service_completed_successfully

  feed-migrate:
    <<: *job
    build: !reset null
    image: ${RELEASE_FEED_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_migrator:${FEED_POSTGRES_MIGRATOR_PASSWORD:?production database password required}@feed-postgres:5432/feed?sslmode=disable

  feed:
    <<: *service
    build: !reset null
    image: ${RELEASE_FEED_IMAGE:?release manifest required}
    ports: !reset []
    environment:
      DATABASE_URL: postgres://overmind_app:${FEED_POSTGRES_PASSWORD:?production database password required}@feed-postgres:5432/feed?sslmode=disable
      ENV: production
    depends_on:
      feed-grants:
        condition: service_completed_successfully

  task-hunter-migrate:
    <<: *job
    build: !reset null
    image: ${RELEASE_TASK_HUNTER_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_migrator:${TASK_HUNTER_POSTGRES_MIGRATOR_PASSWORD:?production database password required}@task-hunter-postgres:5432/task_hunter?sslmode=disable

  task-hunter:
    <<: *service
    build: !reset null
    image: ${RELEASE_TASK_HUNTER_IMAGE:?release manifest required}
    user: !reset null
    volumes: !reset []
    environment:
      DATABASE_URL: postgres://overmind_app:${TASK_HUNTER_POSTGRES_PASSWORD:?production database password required}@task-hunter-postgres:5432/task_hunter?sslmode=disable
      ENV: production
      PARSER_TELEGRAM_ENABLED: "false"
      PARSER_TELEGRAM_APIID: !reset null
      PARSER_TELEGRAM_APIHASH: !reset null
      TELEGRAM_API_ID: !reset null
      TELEGRAM_API_HASH: !reset null
      TELEGRAM_PHONE: !reset null
      TELEGRAM_2FA_PASSWORD: !reset null
    depends_on:
      task-hunter-grants:
        condition: service_completed_successfully

  recommendations-migrate:
    <<: *job
    build: !reset null
    image: ${RELEASE_RECOMMENDATIONS_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_migrator:${RECOMMENDATIONS_POSTGRES_MIGRATOR_PASSWORD:?production database password required}@recommendations-postgres:5432/recommendations?sslmode=disable

  recommendations:
    <<: *service
    build: !reset null
    image: ${RELEASE_RECOMMENDATIONS_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_app:${RECOMMENDATIONS_POSTGRES_PASSWORD:?production database password required}@recommendations-postgres:5432/recommendations?sslmode=disable
      RECOMMENDATIONS_RESOURCE_PROJECTION_ENABLED: "false"
      CONTENT_GRPC_CATALOG_TOKEN: !reset null
    depends_on:
      recommendations-grants:
        condition: service_completed_successfully

  content-migrate:
    <<: *job
    build: !reset null
    image: ${RELEASE_CONTENT_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_migrator:${CONTENT_POSTGRES_MIGRATOR_PASSWORD:?production database password required}@content-postgres:5432/content?sslmode=disable

  content:
    <<: *service
    build: !reset null
    image: ${RELEASE_CONTENT_IMAGE:?release manifest required}
    ports: !reset []
    environment:
      DATABASE_URL: postgres://overmind_app:${CONTENT_POSTGRES_PASSWORD:?production database password required}@content-postgres:5432/content?sslmode=disable
      ENV: production
      CONTENT_GRPC_CATALOG_TOKEN: !reset null
      CONTENT_MEDIA_URL: !reset null
      CONTENT_MEDIA_TOKEN: !reset null
      CONTENT_GRPC_MODERATION_TOKEN: !reset null
    depends_on:
      content-grants:
        condition: service_completed_successfully

  minio:
    <<: *service
    image: ${RELEASE_MINIO_IMAGE:?release manifest required}
    command: ["server", "/data"]
    mem_limit: 768m
    ports: !override
      - "127.0.0.1:19000:9000"
    environment:
      MINIO_BROWSER: "off"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?production MinIO root user required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:?public HTTPS origin required}

  media-buckets:
    <<: *job
    platform: linux/amd64
    image: ${RELEASE_MINIO_IMAGE:?release manifest required}
    entrypoint: ["/bin/sh", "/app/minio/init.sh"]
    command: !reset null
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777,size=16m
    volumes:
      - type: bind
        source: ./deploy/minio
        target: /app/minio
        read_only: true
        bind:
          create_host_path: false
    environment:
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?limited S3 access key required}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?limited S3 secret key required}
      SANDBOX_TESTS_ACCESS_KEY_ID: ${SANDBOX_TESTS_ACCESS_KEY_ID:?limited tests access key required}
      SANDBOX_TESTS_SECRET_ACCESS_KEY: ${SANDBOX_TESTS_SECRET_ACCESS_KEY:?limited tests secret key required}
      SANDBOX_ARTIFACTS_ACCESS_KEY_ID: ${SANDBOX_ARTIFACTS_ACCESS_KEY_ID:?limited artifacts access key required}
      SANDBOX_ARTIFACTS_SECRET_ACCESS_KEY: ${SANDBOX_ARTIFACTS_SECRET_ACCESS_KEY:?limited artifacts secret key required}

  clamav:
    <<: *service
    image: ${RELEASE_CLAMAV_IMAGE:?release manifest required}
    profiles: !reset []
    cpus: 1.5
    mem_limit: 4g

  media-migrate:
    <<: *job
    build: !reset null
    image: ${RELEASE_MEDIA_IMAGE:?release manifest required}
    environment:
      DATABASE_URL: postgres://overmind_migrator:${MEDIA_POSTGRES_MIGRATOR_PASSWORD:?production database password required}@media-postgres:5432/media?sslmode=disable

  media-renderer:
    <<: *service
    build: !reset null
    image: ${RELEASE_MEDIA_RENDERER_IMAGE:?release manifest required}
    cpus: 1
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 32
    security_opt: !override ["no-new-privileges:true"]

  media:
    <<: *service
    build: !reset null
    image: ${RELEASE_MEDIA_IMAGE:?release manifest required}
    user: "10001:10003"
    mem_limit: 512m
    ports: !reset []
    environment:
      DATABASE_URL: postgres://overmind_app:${MEDIA_POSTGRES_PASSWORD:?production database password required}@media-postgres:5432/media?sslmode=disable
      ENV: production
      MEDIA_ALLOW_UNSCANNED_LOCAL: "false"
      MEDIA_ENABLE_UPLOAD_CLEANUP: "false"
      MEDIA_GATEWAY_TOKEN: ${MEDIA_GATEWAY_TOKEN:?production service token required}
      MEDIA_USERS_TOKEN: ${MEDIA_USERS_TOKEN:?production service token required}
      MEDIA_CONTENT_TOKEN: !reset null
      MEDIA_S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:?public HTTPS S3 endpoint required}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?public HTTPS media URL required}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?limited S3 access key required}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?limited S3 secret key required}
    depends_on:
      media-grants:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  api-gateway:
    <<: *service
    build: !reset null
    image: ${RELEASE_API_GATEWAY_IMAGE:?release manifest required}
    ports: !override
      - "127.0.0.1:18081:8081"
    environment:
      APP_ENV: production
      CONTENT_GRPC_ADDR: !reset null
      CONTENT_GRPC_SERVICE_TOKEN: !reset null
      CONTENT_GRPC_MODERATION_TOKEN: !reset null
      CONTENT_GRPC_INSECURE: !reset null
      CONTENT_GRPC_TIMEOUT: !reset null
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_PROXY_CIDRS: ${PRODUCTION_APP_BRIDGE_GATEWAY:-172.29.163.1}/32
      CORS_ORIGINS: ${CORS_ORIGINS:?public HTTPS origin required}
      MEDIA_TOKEN: ${MEDIA_GATEWAY_TOKEN:?production service token required}

  frontend:
    <<: *service
    build: !reset null
    image: ${RELEASE_FRONTEND_IMAGE:?release manifest required}
    ports: !override
      - "127.0.0.1:13000:3000"

  sandbox-postgres:
    <<: *postgres
    ports: !override []
    environment:
      <<: *postgres-env
      POSTGRES_DB: sandbox
      POSTGRES_PASSWORD: ${SANDBOX_POSTGRES_ADMIN_PASSWORD:?production database password required}
      OVM_DB_MIGRATOR_PASSWORD: ${SANDBOX_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      OVM_DB_APP_PASSWORD: ${SANDBOX_POSTGRES_PASSWORD:?production database password required}
    volumes:
      - sandbox-postgres:/var/lib/postgresql/data
      - *postgres-mount

  sandbox-migrate:
    <<: *job
    image: ${RELEASE_POSTGRES_IMAGE:?release manifest required}
    user: postgres
    entrypoint: ["psql"]
    command: ["-X", "-v", "ON_ERROR_STOP=1", "-1", "-f", "/app/001_init_runs.sql"]
    environment:
      PGHOST: sandbox-postgres
      PGUSER: overmind_migrator
      PGDATABASE: sandbox
      PGPASSWORD: ${SANDBOX_POSTGRES_MIGRATOR_PASSWORD:?production database password required}
      PGCONNECT_TIMEOUT: "5"
    volumes:
      - type: bind
        source: ${RELEASE_SANDBOX_MIGRATION:?pinned Sandbox migration required}
        target: /app/001_init_runs.sql
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      sandbox-postgres:
        condition: service_healthy

  sandbox:
    <<: *service
    profiles: !reset []
    build: !reset null
    image: ${RELEASE_SANDBOX_IMAGE:?release manifest required}
    ports: !reset []
    user: "10001:10001"
    environment:
      SANDBOX_ENV: prod
      SANDBOX_CONFIG_FILE: configs/prod.yaml
      SANDBOX_WORKER_ID: ${SANDBOX_WORKER_ID:?stable worker identifier required}
      SANDBOX_KAFKA_BROKERS: kafka:9092
      SANDBOX_EXECUTOR_TYPE: gojudge
      SANDBOX_FEATURE_FAKE_EXECUTOR: "false"
      SANDBOX_FEATURE_GOJUDGE_EXECUTOR: "true"
      SANDBOX_GOJUDGE_BASE_URL: ${SANDBOX_GOJUDGE_BASE_URL:?private HTTPS runner endpoint required}
      SANDBOX_GOJUDGE_COMPILER_URL: ${SANDBOX_GOJUDGE_COMPILER_URL:?private HTTPS compiler endpoint required}
      SANDBOX_GOJUDGE_TLS_CA_FILE: /run/sandbox/gojudge-tls/runner-ca.pem
      SANDBOX_GOJUDGE_TLS_CERT_FILE: /run/sandbox/gojudge-tls/worker.pem
      SANDBOX_GOJUDGE_TLS_KEY_FILE: /run/sandbox/gojudge-tls/worker-key.pem
      SANDBOX_STORAGE_TYPE: postgres
      SANDBOX_MAX_IN_FLIGHT: "1"
      SANDBOX_PYTHON_MAX_IN_FLIGHT: "1"
      SANDBOX_SCHEDULER_QUEUE_MAX_DEPTH: "16"
      SANDBOX_POSTGRES_DSN: postgres://overmind_app:${SANDBOX_POSTGRES_PASSWORD:?production database password required}@sandbox-postgres:5432/sandbox?sslmode=disable
      SANDBOX_TESTS_BUCKET: sandbox-tests
      SANDBOX_TESTS_KEY_PREFIX: sandbox-tests/prod
      SANDBOX_TESTS_ENDPOINT: http://minio:9000
      SANDBOX_TESTS_REGION: us-east-1
      SANDBOX_TESTS_FORCE_PATH_STYLE: "true"
      SANDBOX_TESTS_ACCESS_KEY_ID: ${SANDBOX_TESTS_ACCESS_KEY_ID:?limited tests access key required}
      SANDBOX_TESTS_SECRET_ACCESS_KEY: ${SANDBOX_TESTS_SECRET_ACCESS_KEY:?limited tests secret key required}
      SANDBOX_ARTIFACTS_BUCKET: sandbox-artifacts
      SANDBOX_ARTIFACTS_KEY_PREFIX: sandbox-artifacts/prod
      SANDBOX_ARTIFACTS_ENDPOINT: http://minio:9000
      SANDBOX_ARTIFACTS_REGION: us-east-1
      SANDBOX_ARTIFACTS_FORCE_PATH_STYLE: "true"
      SANDBOX_ARTIFACTS_ACCESS_KEY_ID: ${SANDBOX_ARTIFACTS_ACCESS_KEY_ID:?limited artifacts access key required}
      SANDBOX_ARTIFACTS_SECRET_ACCESS_KEY: ${SANDBOX_ARTIFACTS_SECRET_ACCESS_KEY:?limited artifacts secret key required}
    volumes:
      - type: bind
        source: ${RELEASE_RUNNER_TLS_DIR:?worker TLS directory required}
        target: /run/sandbox/gojudge-tls
        read_only: true
        bind:
          create_host_path: false
    networks: !override [default]
    depends_on: !override
      kafka-topics:
        condition: service_completed_successfully
      sandbox-grants:
        condition: service_completed_successfully
      media-buckets:
        condition: service_completed_successfully

volumes:
  catalog-bootstrap-state: !reset null
  sandbox-postgres:

networks:
  sandbox-runtime: !reset null
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: nat
    ipam:
      config:
        - subnet: ${PRODUCTION_APP_BRIDGE_SUBNET:-172.29.163.0/24}
          gateway: ${PRODUCTION_APP_BRIDGE_GATEWAY:-172.29.163.1}
