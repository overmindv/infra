name: Check release candidate

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Contents of the published release.json
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-candidate-e2e
  cancel-in-progress: false

jobs:
  journeys:
    uses: overmindv/tests/.github/workflows/release-e2e.yml@17d29764f84e9ea26776a133c8008984de912631
    with:
      tests_ref: 17d29764f84e9ea26776a133c8008984de912631
      manifest: ${{ inputs.manifest }}
