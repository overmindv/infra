name: Infra CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and scripts
        run: make lint

  # Полный e2e-прогон системы (см. overmindv/tests) при пуше/PR в этот сервис.
  e2e:
    permissions:
      contents: read
    uses: overmindv/tests/.github/workflows/e2e.yml@main
    secrets: inherit
    with:
      target_repo: infra
