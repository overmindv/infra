name: Infra CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and scripts
        run: make lint
      - name: Test monitoring rules and scripts
        run: sh scripts/check-monitoring.sh

  catalog-kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check catalog Kafka TLS and legacy client access
        run: sh tests/catalog-kafka-live.sh

  sandbox-kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Sandbox Kafka SCRAM rollout and rollback
        run: sh tests/catalog-kafka-live.sh sandbox

  content-kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Content Kafka TLS, reader access and rollback
        run: sh tests/catalog-kafka-live.sh content

  tasks-kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Tasks Kafka TLS, ACLs and consumer offsets
        run: sh tests/catalog-kafka-live.sh tasks

