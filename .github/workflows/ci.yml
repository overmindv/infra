name: Ratchet CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and scripts
        run: make lint

  kustomize-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.34.8
      - name: Validate Kubernetes baseline
        run: kubectl kustomize k8s >/dev/null
