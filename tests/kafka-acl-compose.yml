services:
  broker:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_PLAINTEXT,CLIENT:SASL_PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,CLIENT://:9092
      KAFKA_ADVERTISED_LISTENERS: CLIENT://broker:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${FIXTURE_KAFKA_PASSWORD:?set fixture password}"
        user_broker="${FIXTURE_KAFKA_PASSWORD}";
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${FIXTURE_KAFKA_PASSWORD}"
        user_broker="${FIXTURE_KAFKA_PASSWORD}"
        user_fixture_admin="${FIXTURE_KAFKA_PASSWORD}"
        user_tasks="${FIXTURE_KAFKA_PASSWORD}"
        user_sandbox="${FIXTURE_KAFKA_PASSWORD}"
        user_tasks-v2="${FIXTURE_KAFKA_PASSWORD}"
        user_sandbox-v2="${FIXTURE_KAFKA_PASSWORD}"
        user_feed="${FIXTURE_KAFKA_PASSWORD}"
        user_content="${FIXTURE_KAFKA_PASSWORD}"
        user_users="${FIXTURE_KAFKA_PASSWORD}";
      KAFKA_SUPER_USERS: User:broker;User:fixture_admin
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/topic-data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    tmpfs:
      - /tmp/topic-data:mode=1777,size=134217728
    volumes:
      - ../scripts/kafka:/opt/overmind/kafka:ro
    networks: [testnet]
networks:
  testnet:
    internal: true
