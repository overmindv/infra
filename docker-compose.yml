name: overmindv

services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  kafka-topics:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    entrypoint: ["/bin/sh", "/opt/overmind/kafka/topics.sh"]
    command: ["local", "kafka:9092"]
    volumes:
      - ./scripts/kafka:/opt/overmind/kafka:ro
    environment:
      KAFKA_REQUESTS_TOPIC: ${KAFKA_REQUESTS_TOPIC:-code-execution.requests.v1}
      KAFKA_RESULTS_TOPIC: ${KAFKA_RESULTS_TOPIC:-code-execution.results.v1}
      KAFKA_RETRY_TOPIC: ${KAFKA_RETRY_TOPIC:-code-execution.retry.v1}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-code-execution.events.v1}
      KAFKA_DEADLETTER_TOPIC: ${KAFKA_DEADLETTER_TOPIC:-code-execution.deadletter.v1}
      KAFKA_CONTENT_TOPIC: ${KAFKA_CONTENT_TOPIC:-content.content-item-events}
      KAFKA_CATALOG_ACTIVITY_TOPIC: ${KAFKA_CATALOG_ACTIVITY_TOPIC:-catalog.activity.v1}
      KAFKA_TASK_ACTIVITY_TOPIC: ${KAFKA_TASK_ACTIVITY_TOPIC:-task.activity.v1}
      KAFKA_CONTENT_MATERIAL_TOPIC: ${KAFKA_CONTENT_MATERIAL_TOPIC:-content.material.v1}
      KAFKA_CONTENT_LEARNING_TOPIC: ${KAFKA_CONTENT_LEARNING_TOPIC:-content.learning.v1}
      KAFKA_CONTENT_CONTRIBUTION_TOPIC: ${KAFKA_CONTENT_CONTRIBUTION_TOPIC:-content.contribution.v1}
      KAFKA_RESULTS_CONSUMER_GROUP: ${KAFKA_RESULTS_CONSUMER_GROUP:-tasks-code-results-v1}
      SANDBOX_KAFKA_GROUP_ID: ${SANDBOX_KAFKA_GROUP_ID:-sandbox-code-execution-v1}
      FEED_CONSUMER_GROUP: ${FEED_CONSUMER_GROUP:-feed-v1}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
      KAFKA_EXECUTION_MAX_BATCH_BYTES: ${KAFKA_EXECUTION_MAX_BATCH_BYTES:-3145728}
      KAFKA_METADATA_MAX_BATCH_BYTES: ${KAFKA_METADATA_MAX_BATCH_BYTES:-262144}
      KAFKA_RESERVE_EXECUTION_V2: ${KAFKA_RESERVE_EXECUTION_V2:-false}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # kafka-ui — веб-панель для просмотра топиков, consumer-групп, лага и сообщений.
  # Открывается на http://localhost:${KAFKA_UI_PORT:-8086} (никто не должен открывать :29092 в браузере — это TCP-порт брокера).
  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:latest}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8086}:8080"
    restart: unless-stopped

  # Probe TCP explicitly: the official image starts a temporary Unix-socket-only
  # server during initdb. Socket readiness can release migrations before the final
  # TCP listener exists. This applies to every Postgres service below.
  users-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USERS_POSTGRES_DB:-users}
      POSTGRES_USER: ${USERS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_PASSWORD:?set USERS_POSTGRES_PASSWORD in .env}
    ports:
      - "${USERS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - users-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  users-migrate:
    build:
      context: ../users
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://${USERS_POSTGRES_USER:-postgres}:${USERS_POSTGRES_PASSWORD}@users-postgres:5432/${USERS_POSTGRES_DB:-users}?sslmode=disable"
    entrypoint: ["users", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      users-postgres:
        condition: service_healthy
    restart: "no"

  users:
    build:
      context: ../users
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      HTTP_ADDR: ":8080"
      ENV: staging
      LOG_LEVEL: info
      DATABASE_URL: "postgres://${USERS_POSTGRES_USER:-postgres}:${USERS_POSTGRES_PASSWORD}@users-postgres:5432/${USERS_POSTGRES_DB:-users}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-users}
      JWT_TTL: ${JWT_TTL:-24h}
      BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:-admin@overmindv.local}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:?set BOOTSTRAP_SUPERUSER_PASSWORD in .env}
      BOOTSTRAP_SUPERUSER_USERNAME: ${BOOTSTRAP_SUPERUSER_USERNAME:-superadmin}
      MEDIA_URL: http://media:8080
      MEDIA_USERS_TOKEN: ${MEDIA_USERS_TOKEN:-${MEDIA_INTERNAL_TOKEN}-users}
      MEDIA_TIMEOUT: ${MEDIA_TIMEOUT:-10s}
      USERS_WORKER_POLL_INTERVAL: ${USERS_WORKER_POLL_INTERVAL:-1s}
    depends_on:
      users-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  entities-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: entities
      POSTGRES_USER: entities
      POSTGRES_PASSWORD: ${ENTITIES_POSTGRES_PASSWORD:?set ENTITIES_POSTGRES_PASSWORD in .env}
    ports:
      - "${ENTITIES_POSTGRES_PORT:-5433}:5432"
    volumes:
      - entities-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U entities -d entities"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  entities-migrate:
    build:
      context: ../entities
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://entities:${ENTITIES_POSTGRES_PASSWORD}@entities-postgres:5432/entities?sslmode=disable"
    entrypoint: ["entities", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      entities-postgres:
        condition: service_healthy
    restart: "no"

  entities:
    build:
      context: ../entities
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: entities
      HTTP_ADDR: ":8080"
      ENV: local
      LOG_LEVEL: info
      ENTITIES_SNAPSHOT_TOKEN: "${ENTITIES_SNAPSHOT_TOKEN:-}"
      ENTITIES_GATEWAY_TOKEN: "${ENTITIES_GATEWAY_TOKEN:-}"
      DATABASE_URL: "postgres://entities:${ENTITIES_POSTGRES_PASSWORD}@entities-postgres:5432/entities?sslmode=disable"
    depends_on:
      entities-migrate:
        condition: service_completed_successfully
    ports:
      - "${ENTITIES_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  tasks-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${TASKS_POSTGRES_PASSWORD:?set TASKS_POSTGRES_PASSWORD in .env}
    ports:
      - "${TASKS_POSTGRES_PORT:-5434}:5432"
    volumes:
      - tasks-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tasks -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  tasks-migrate:
    build:
      context: ../tasks
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://tasks:${TASKS_POSTGRES_PASSWORD}@tasks-postgres:5432/tasks?sslmode=disable"
    entrypoint: ["tasks", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      tasks-postgres:
        condition: service_healthy
    restart: "no"

  tasks:
    build:
      context: ../tasks
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: tasks
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://tasks:${TASKS_POSTGRES_PASSWORD}@tasks-postgres:5432/tasks?sslmode=disable"
      ENV: local
      READ_TIMEOUT: ${TASKS_READ_TIMEOUT:-10s}
      WRITE_TIMEOUT: ${TASKS_WRITE_TIMEOUT:-20s}
      TASK_HUNTER_INGEST_TOKEN: ${TASK_HUNTER_INGEST_TOKEN:?set TASK_HUNTER_INGEST_TOKEN in .env}
      TASKS_RESOURCE_TOKEN: "${TASKS_RESOURCE_TOKEN:-}"
      TASKS_LEARNING_OUTCOMES_ENABLED: "${TASKS_LEARNING_OUTCOMES_ENABLED:-false}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REQUESTS_TOPIC: ${KAFKA_REQUESTS_TOPIC:-code-execution.requests.v1}
      KAFKA_RESULTS_TOPIC: ${KAFKA_RESULTS_TOPIC:-code-execution.results.v1}
      KAFKA_RESULTS_CONSUMER_GROUP: ${KAFKA_RESULTS_CONSUMER_GROUP:-tasks-code-results-v1}
      KAFKA_OUTBOX_POLL_INTERVAL: ${KAFKA_OUTBOX_POLL_INTERVAL:-500ms}
      CODE_EXECUTION_TIME_LIMIT: ${CODE_EXECUTION_TIME_LIMIT:-1s}
      CODE_EXECUTION_MEMORY_LIMIT_BYTES: ${CODE_EXECUTION_MEMORY_LIMIT_BYTES:-67108864}
      CODE_EXECUTION_MAX_ATTEMPTS: ${CODE_EXECUTION_MAX_ATTEMPTS:-3}
      CODE_EXECUTION_RETRY_GRACE: ${CODE_EXECUTION_RETRY_GRACE:-2m}
      CODE_EXECUTION_REAPER_INTERVAL: ${CODE_EXECUTION_REAPER_INTERVAL:-30s}
    depends_on:
      tasks-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  feed-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: feed
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: ${FEED_POSTGRES_PASSWORD:?set FEED_POSTGRES_PASSWORD in .env}
    ports:
      - "${FEED_POSTGRES_PORT:-5437}:5432"
    volumes:
      - feed-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U feed -d feed"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  feed-migrate:
    build:
      context: ../feed
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://feed:${FEED_POSTGRES_PASSWORD}@feed-postgres:5432/feed?sslmode=disable"
    entrypoint: ["feed", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      feed-postgres:
        condition: service_healthy
    restart: "no"

  feed:
    build:
      context: ../feed
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: feed
      HTTP_ADDR: ":8080"
      ENV: local
      LOG_LEVEL: info
      DATABASE_URL: "postgres://feed:${FEED_POSTGRES_PASSWORD}@feed-postgres:5432/feed?sslmode=disable"
      FEED_GATEWAY_TOKEN: ${FEED_GATEWAY_TOKEN:?set FEED_GATEWAY_TOKEN in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CATALOG_ACTIVITY_TOPIC: ${KAFKA_CATALOG_ACTIVITY_TOPIC:-catalog.activity.v1}
      KAFKA_TASK_ACTIVITY_TOPIC: ${KAFKA_TASK_ACTIVITY_TOPIC:-task.activity.v1}
      FEED_CONSUMER_GROUP: ${FEED_CONSUMER_GROUP:-feed-v1}
    depends_on:
      feed-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    ports:
      - "${FEED_PORT:-8087}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # sandbox — исполнитель кода (gojudge/fake): потребляет code-execution.requests.v1
  # из tasks, исполняет код по входным кейсам и публикует результат в results.v1.
  # Профильный сервис: НЕ входит в дефолтный `make up` — он не нужен unit/integration-тестам,
  # а его Go-сборка тяжёлая (важно на машинах с малым объёмом RAM). Без него programming-сабмиты
  # остаются в статусе queued (verdict не выставляется). Поднять: `make up SANDBOX=1` или `make sandbox-up`.
  sandbox:
    profiles: ["sandbox"]
    build:
      context: ../sandbox
      dockerfile: deployments/docker/Dockerfile.worker
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SANDBOX_ENV: local
      SANDBOX_LOG_LEVEL: ${SANDBOX_LOG_LEVEL:-info}
      SANDBOX_KAFKA_BROKERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SANDBOX_KAFKA_GROUP_ID: ${SANDBOX_KAFKA_GROUP_ID:-sandbox-code-execution-v1}
      SANDBOX_KAFKA_TOPIC_REQUESTS: ${KAFKA_REQUESTS_TOPIC:-code-execution.requests.v1}
      SANDBOX_KAFKA_TOPIC_RETRY: ${KAFKA_RETRY_TOPIC:-code-execution.retry.v1}
      SANDBOX_KAFKA_TOPIC_EVENTS: ${KAFKA_EVENTS_TOPIC:-code-execution.events.v1}
      SANDBOX_KAFKA_TOPIC_RESULTS: ${KAFKA_RESULTS_TOPIC:-code-execution.results.v1}
      SANDBOX_KAFKA_TOPIC_DEADLETTER: ${KAFKA_DEADLETTER_TOPIC:-code-execution.deadletter.v1}
      # fake — мгновенный исполнитель без gojudge (по умолчанию); gojudge — реальное исполнение.
      SANDBOX_EXECUTOR_TYPE: ${SANDBOX_EXECUTOR_TYPE:-fake}
      SANDBOX_FEATURE_FAKE_EXECUTOR: ${SANDBOX_FEATURE_FAKE_EXECUTOR:-true}
      SANDBOX_FEATURE_GOJUDGE_EXECUTOR: ${SANDBOX_FEATURE_GOJUDGE_EXECUTOR:-false}
      SANDBOX_GOJUDGE_BASE_URL: http://gojudge:5050
      SANDBOX_GOJUDGE_COMPILER_URL: http://gojudge-compiler:5050
      SANDBOX_STORAGE_TYPE: ${SANDBOX_STORAGE_TYPE:-memory}
    networks:
      - default
      - sandbox-runtime
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      gojudge:
        condition: service_healthy
        required: false
      gojudge-compiler:
        condition: service_healthy
        required: false
    ports:
      - "${SANDBOX_HEALTH_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # gojudge — песочница реального исполнения кода (isolate). Опциональна: запускается профилем
  # "gojudge" и требует SANDBOX_EXECUTOR_TYPE=gojudge в .env (а также рантайм-образы языков).
  gojudge:
    profiles: ["gojudge"]
    image: ${SANDBOX_GOJUDGE_LOCAL_IMAGE:-overmindv/infra-gojudge:local}
    build:
      context: ../sandbox
      dockerfile: deployments/docker/Dockerfile.gojudge-runtime
    privileged: true
    read_only: true
    shm_size: 256m
    tmpfs:
      - /tmp:size=128m
      - /w:size=128m
    command: ["-file-timeout", "2m", "-no-fallback"]
    networks: [sandbox-runtime]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5050/version >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  gojudge-compiler:
    profiles: ["gojudge"]
    image: ${SANDBOX_GOJUDGE_LOCAL_IMAGE:-overmindv/infra-gojudge:local}
    pull_policy: never
    depends_on:
      gojudge:
        condition: service_started
    privileged: true
    read_only: true
    cpus: 4
    mem_limit: 3g
    shm_size: 256m
    tmpfs:
      - /tmp:size=256m
      - /w:size=128m
    command:
      - -http-addr
      - 0.0.0.0:5050
      - -parallelism
      - "2"
      - -container-cred-start
      - "10000"
      - -tmp-fs-param
      - size=128m,nr_inodes=4096
      - -output-limit
      - "33554432"
      - -copy-out-limit
      - "1048576"
      - -file-timeout
      - 2m
      - -no-fallback
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5050/version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [sandbox-runtime]
    restart: unless-stopped

  task-hunter-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task_hunter
      POSTGRES_USER: task_hunter
      POSTGRES_PASSWORD: ${TASK_HUNTER_POSTGRES_PASSWORD:?set TASK_HUNTER_POSTGRES_PASSWORD in .env}
    volumes:
      - task-hunter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U task_hunter -d task_hunter"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  task-hunter-migrate:
    build:
      context: ../task-hunter
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://task_hunter:${TASK_HUNTER_POSTGRES_PASSWORD}@task-hunter-postgres:5432/task_hunter?sslmode=disable"
    entrypoint: ["task-hunter", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      task-hunter-postgres:
        condition: service_healthy
    restart: "no"

  task-hunter:
    build:
      context: ../task-hunter
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      SERVICE_NAME: task-hunter
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://task_hunter:${TASK_HUNTER_POSTGRES_PASSWORD}@task-hunter-postgres:5432/task_hunter?sslmode=disable"
      ENV: local
      PARSER_SCHEDULE_COLLECTCRON: "${TASK_HUNTER_CRON:-0 */6 * * *}"
      PARSER_TASKS_URL: http://tasks:8080
      PARSER_TASKS_TOKEN: ${TASK_HUNTER_INGEST_TOKEN:?set TASK_HUNTER_INGEST_TOKEN in .env}
      PARSER_SECURITY_GATEWAYTOKEN: ${TASK_HUNTER_GATEWAY_TOKEN:?set TASK_HUNTER_GATEWAY_TOKEN in .env}
      PARSER_TELEGRAM_ENABLED: ${TASK_HUNTER_TELEGRAM_ENABLED:-false}
      PARSER_TELEGRAM_APIID: ${TASK_HUNTER_TELEGRAM_API_ID:-0}
      PARSER_TELEGRAM_APIHASH: ${TASK_HUNTER_TELEGRAM_API_HASH:-}
      PARSER_TELEGRAM_SESSIONPATH: /var/lib/task-hunter/telegram.session
      PARSER_TELEGRAM_CHANNELS: ${TASK_HUNTER_TELEGRAM_CHANNELS:-analytic_postupashki,postupashki_ml,algoses}
      PARSER_WORKER_DEFAULTLIMIT: ${TASK_HUNTER_DEFAULT_LIMIT:-100}
      PARSER_WEBSITE_CODEFORCESREADERURL: ${TASK_HUNTER_CODEFORCES_READER_URL:-https://r.jina.ai/http://codeforces.com}
      TELEGRAM_API_ID: ${TASK_HUNTER_TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TASK_HUNTER_TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_2FA_PASSWORD: ${TELEGRAM_2FA_PASSWORD:-}
      TELEGRAM_SESSION_PATH: /var/lib/task-hunter/telegram.session
    volumes:
      - ./.local/task-hunter:/var/lib/task-hunter
    depends_on:
      task-hunter-migrate:
        condition: service_completed_successfully
      tasks:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  recommendations-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recommendations
      POSTGRES_USER: recommendations
      POSTGRES_PASSWORD: ${RECOMMENDATIONS_POSTGRES_PASSWORD:?set RECOMMENDATIONS_POSTGRES_PASSWORD in .env}
    ports:
      - "${RECOMMENDATIONS_POSTGRES_PORT:-5438}:5432"
    volumes:
      - recommendations-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U recommendations -d recommendations"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  recommendations-migrate:
    build:
      context: ../recommendations
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://recommendations:${RECOMMENDATIONS_POSTGRES_PASSWORD}@recommendations-postgres:5432/recommendations?sslmode=disable"
    entrypoint: ["recommendations", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      recommendations-postgres:
        condition: service_healthy
    restart: "no"

  recommendations:
    build:
      context: ../recommendations
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      HTTP_ADDRESS: ":8080"
      KAFKA_CONTENT_MATERIAL_TOPIC: ${KAFKA_CONTENT_MATERIAL_TOPIC:-content.material.v1}
      KAFKA_CONTENT_LEARNING_TOPIC: ${KAFKA_CONTENT_LEARNING_TOPIC:-content.learning.v1}
      DATABASE_URL: "postgres://recommendations:${RECOMMENDATIONS_POSTGRES_PASSWORD}@recommendations-postgres:5432/recommendations?sslmode=disable"
      RECOMMENDATIONS_SERVICE_TOKEN: ${RECOMMENDATIONS_SERVICE_TOKEN:?set RECOMMENDATIONS_SERVICE_TOKEN in .env}
      WRITE_TIMEOUT: 35s
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_FREE_TIER_CONFIRMED: ${AI_FREE_TIER_CONFIRMED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    depends_on:
      recommendations-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api-gateway:
    build:
      context: ../api-gateway
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      PORT: "8081"
      USERS_GRAPHQL_URL: http://users:8080/query
      USERS_HEALTH_URL: http://users:8080/health
      USERS_TIMEOUT: ${USERS_TIMEOUT:-5s}
      ENTITIES_URL: http://entities:8080
      ENTITIES_GATEWAY_TOKEN: "${ENTITIES_GATEWAY_TOKEN:-}"
      ENTITIES_TIMEOUT: ${ENTITIES_TIMEOUT:-5s}
      TASKS_URL: http://tasks:8080
      TASKS_TIMEOUT: ${TASKS_TIMEOUT:-5s}
      TASK_HUNTER_URL: http://task-hunter:8080
      TASK_HUNTER_TOKEN: ${TASK_HUNTER_GATEWAY_TOKEN:?set TASK_HUNTER_GATEWAY_TOKEN in .env}
      TASK_HUNTER_TIMEOUT: ${TASK_HUNTER_TIMEOUT:-10s}
      MEDIA_URL: http://media:8080
      MEDIA_TOKEN: ${MEDIA_GATEWAY_TOKEN:-${MEDIA_INTERNAL_TOKEN}}
      MEDIA_TIMEOUT: ${MEDIA_TIMEOUT:-10s}
      FEED_URL: http://feed:8080
      FEED_TOKEN: ${FEED_GATEWAY_TOKEN:?set FEED_GATEWAY_TOKEN in .env}
      FEED_TIMEOUT: ${FEED_TIMEOUT:-10s}
      RECOMMENDATIONS_URL: http://recommendations:8080
      RECOMMENDATIONS_SERVICE_TOKEN: ${RECOMMENDATIONS_SERVICE_TOKEN:?set RECOMMENDATIONS_SERVICE_TOKEN in .env}
      CONTENT_GRPC_ADDR: ${CONTENT_GRPC_SERVICE_TOKEN:+content:9090}
      CONTENT_GRPC_SERVICE_TOKEN: ${CONTENT_GRPC_SERVICE_TOKEN:-}
      CONTENT_GRPC_INSECURE: "true"
      CONTENT_GRPC_TIMEOUT: ${CONTENT_GRPC_TIMEOUT:-3s}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-users}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REQUEST_LOG_PATH: ""
    depends_on:
      users:
        condition: service_healthy
      entities:
        condition: service_healthy
      tasks:
        condition: service_healthy
      task-hunter:
        condition: service_healthy
      media:
        condition: service_healthy
      feed:
        condition: service_healthy
      recommendations:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /graphql
        VITE_MEDIA_DOWNLOAD_ORIGINS: ${VITE_MEDIA_DOWNLOAD_ORIGINS:-http://localhost:${MINIO_API_PORT:-9000}}
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  content-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${CONTENT_POSTGRES_PASSWORD:?set CONTENT_POSTGRES_PASSWORD in .env}
    ports:
      - "${CONTENT_POSTGRES_PORT:-5436}:5432"
    volumes:
      - content-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U content -d content"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  content-migrate:
    build:
      context: ../content
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://content:${CONTENT_POSTGRES_PASSWORD}@content-postgres:5432/content?sslmode=disable"
    entrypoint: ["content", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      content-postgres:
        condition: service_healthy
    restart: "no"

  content:
    build:
      context: ../content
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: content
      HTTP_ADDR: ":8080"
      ENV: local
      LOG_LEVEL: info
      DATABASE_URL: "postgres://content:${CONTENT_POSTGRES_PASSWORD}@content-postgres:5432/content?sslmode=disable"
      GRPC_ADDR: ":9090"
      CONTENT_GRPC_SERVICE_TOKEN: ${CONTENT_GRPC_SERVICE_TOKEN:-}
      CONTENT_ENTITIES_URL: ${CONTENT_ENTITIES_URL:-http://entities:8080}
      KAFKA_ENABLED: ${CONTENT_KAFKA_ENABLED:-true}
      KAFKA_TOPIC: ${KAFKA_CONTENT_TOPIC:-content.content-item-events}
      KAFKA_CONTENT_MATERIAL_TOPIC: ${KAFKA_CONTENT_MATERIAL_TOPIC:-content.material.v1}
      KAFKA_CONTENT_LEARNING_TOPIC: ${KAFKA_CONTENT_LEARNING_TOPIC:-content.learning.v1}
      KAFKA_CONTENT_CONTRIBUTION_TOPIC: ${KAFKA_CONTENT_CONTRIBUTION_TOPIC:-content.contribution.v1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CONTENT_GRPC_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  media-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: media
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${MEDIA_POSTGRES_PASSWORD:?set MEDIA_POSTGRES_PASSWORD in .env}
    ports:
      - "${MEDIA_POSTGRES_PORT:-5435}:5432"
    volumes:
      - media-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U media -d media"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  media-buckets:
    image: cgr.dev/chainguard/minio:latest
    platform: ${MEDIA_TOOL_PLATFORM:-linux/amd64}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/media-quarantine
        mc mb --ignore-existing local/media
        mc anonymous set none local/media-quarantine
        mc anonymous set-json /etc/media/public-policy.json local/media
    volumes:
      - type: bind
        source: ./config/media/public-policy.json
        target: /etc/media/public-policy.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Пока ClamAV недоступен, загруженные файлы остаются в карантине.
  # Локальный запуск: docker compose --profile antivirus up -d clamav
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4_base}
    platform: ${MEDIA_TOOL_PLATFORM:-linux/amd64}
    profiles: ["antivirus"]
    environment:
      CLAMD_CONF_StreamMaxLength: 251M
      CLAMD_CONF_MaxFileSize: 250M
      CLAMD_CONF_MaxScanSize: 500M
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_MaxThreads: "2"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\n' | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    mem_limit: 4g
    restart: unless-stopped

  media-migrate:
    build:
      context: ../media
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://media:${MEDIA_POSTGRES_PASSWORD}@media-postgres:5432/media?sslmode=disable"
    entrypoint: ["media", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      media-postgres:
        condition: service_healthy
    restart: "no"

  media-renderer:
    build:
      context: ../media
      target: renderer
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    user: "10002:10003"
    network_mode: none
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=96m,mode=0700,uid=10002,gid=10003
    volumes:
      - type: volume
        source: media-renderer-socket
        target: /run/media-renderer
        volume:
          nocopy: true
    restart: unless-stopped

  media:
    build:
      context: ../media
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: media
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://media:${MEDIA_POSTGRES_PASSWORD}@media-postgres:5432/media?sslmode=disable"
      ENV: local
      MEDIA_GATEWAY_TOKEN: ${MEDIA_GATEWAY_TOKEN:-${MEDIA_INTERNAL_TOKEN}}
      MEDIA_USERS_TOKEN: ${MEDIA_USERS_TOKEN:-${MEDIA_INTERNAL_TOKEN}-users}
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MEDIA_S3_QUARANTINE_BUCKET: media-quarantine
      MEDIA_S3_MEDIA_BUCKET: media
      MEDIA_S3_PATH_STYLE: "true"
      MEDIA_PUBLIC_BASE_URL: http://localhost:${MINIO_API_PORT:-9000}/media
      MEDIA_CLAMAV_ADDR: clamav:3310
      MEDIA_ALLOW_UNSCANNED_LOCAL: ${MEDIA_ALLOW_UNSCANNED_LOCAL:-false}
      MEDIA_ENABLE_UPLOAD_CLEANUP: ${MEDIA_ENABLE_UPLOAD_CLEANUP:-false}
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-5368709120}
      MEDIA_MAX_MULTIPART_SESSIONS: ${MEDIA_MAX_MULTIPART_SESSIONS:-4}
      MEDIA_MAX_AVATAR_BYTES: ${MEDIA_MAX_AVATAR_BYTES:-20971520}
      MEDIA_MAX_AVATAR_PIXELS: ${MEDIA_MAX_AVATAR_PIXELS:-20971520}
    volumes:
      - type: volume
        source: media-renderer-socket
        target: /run/media-renderer
        read_only: true
        volume:
          nocopy: true
    depends_on:
      media-renderer:
        condition: service_started
      media-migrate:
        condition: service_completed_successfully
      media-buckets:
        condition: service_completed_successfully
    ports:
      - "${MEDIA_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

networks:
  sandbox-runtime:
    internal: true

volumes:
  kafka-data:
  users-postgres:
  entities-postgres:
  tasks-postgres:
  task-hunter-postgres:
  content-postgres:
  feed-postgres:
  recommendations-postgres:
  media-postgres:
  media-renderer-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0750,uid=10002,gid=10003,nosuid,nodev,noexec
  minio-data:
  clamav-data:
