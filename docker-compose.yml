name: overmindv

services:
  users-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USERS_POSTGRES_DB:-users}
      POSTGRES_USER: ${USERS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_PASSWORD:?set USERS_POSTGRES_PASSWORD in .env}
    ports:
      - "${USERS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - users-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  users-migrate:
    build: ../users
    environment:
      DATABASE_URL: "postgres://${USERS_POSTGRES_USER:-postgres}:${USERS_POSTGRES_PASSWORD}@users-postgres:5432/${USERS_POSTGRES_DB:-users}?sslmode=disable"
    entrypoint: ["/bin/sh", "-c"]
    command: ["goose -dir /app/migrations postgres \"$$DATABASE_URL\" up"]
    depends_on:
      users-postgres:
        condition: service_healthy
    restart: "no"

  users:
    build: ../users
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${USERS_POSTGRES_USER:-postgres}:${USERS_POSTGRES_PASSWORD}@users-postgres:5432/${USERS_POSTGRES_DB:-users}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-users}
      JWT_TTL: ${JWT_TTL:-24h}
      BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:-admin@overmindv.local}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:?set BOOTSTRAP_SUPERUSER_PASSWORD in .env}
      BOOTSTRAP_SUPERUSER_USERNAME: ${BOOTSTRAP_SUPERUSER_USERNAME:-superadmin}
    depends_on:
      users-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  entities-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: entities
      POSTGRES_USER: entities
      POSTGRES_PASSWORD: ${ENTITIES_POSTGRES_PASSWORD:?set ENTITIES_POSTGRES_PASSWORD in .env}
    ports:
      - "${ENTITIES_POSTGRES_PORT:-5433}:5432"
    volumes:
      - entities-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entities -d entities"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  entities-migrate:
    build: ../entities
    environment:
      DATABASE_URL: "postgres://entities:${ENTITIES_POSTGRES_PASSWORD}@entities-postgres:5432/entities?sslmode=disable"
    entrypoint: ["/bin/sh", "-c"]
    command: ["goose -dir /app/migrations postgres \"$$DATABASE_URL\" up"]
    depends_on:
      entities-postgres:
        condition: service_healthy
    restart: "no"

  entities:
    build: ../entities
    environment:
      ENTITES_SERVICE_NAME: entities
      ENTITES_HTTP_ADDR: ":8080"
      ENTITES_DATABASE_URL: "postgres://entities:${ENTITIES_POSTGRES_PASSWORD}@entities-postgres:5432/entities?sslmode=disable"
      ENTITES_LOG_LEVEL: ${ENTITIES_LOG_LEVEL:-debug}
      ENTITES_ENV: local
      ENTITES_REQUEST_LOG_PATH: ""
    depends_on:
      entities-migrate:
        condition: service_completed_successfully
    ports:
      - "${ENTITIES_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  tasks-it-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks_it
      POSTGRES_USER: tasks_it
      POSTGRES_PASSWORD: ${TASKS_IT_POSTGRES_PASSWORD:?set TASKS_IT_POSTGRES_PASSWORD in .env}
    ports:
      - "${TASKS_IT_POSTGRES_PORT:-5434}:5432"
    volumes:
      - tasks-it-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_it -d tasks_it"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  tasks-it-migrate:
    build: ../tasks-it
    environment:
      DATABASE_URL: "postgres://tasks_it:${TASKS_IT_POSTGRES_PASSWORD}@tasks-it-postgres:5432/tasks_it?sslmode=disable"
    entrypoint: ["/bin/sh", "-c"]
    command: ["goose -dir /app/migrations postgres \"$$DATABASE_URL\" up"]
    depends_on:
      tasks-it-postgres:
        condition: service_healthy
    restart: "no"

  tasks-it:
    build: ../tasks-it
    environment:
      SERVICE_NAME: tasks-it
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://tasks_it:${TASKS_IT_POSTGRES_PASSWORD}@tasks-it-postgres:5432/tasks_it?sslmode=disable"
      LOG_LEVEL: ${TASKS_IT_LOG_LEVEL:-debug}
      ENV: local
      READ_TIMEOUT: ${TASKS_IT_READ_TIMEOUT:-10s}
      WRITE_TIMEOUT: ${TASKS_IT_WRITE_TIMEOUT:-20s}
    depends_on:
      tasks-it-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api-gateway:
    build: ../api-gateway
    environment:
      PORT: "8081"
      ARCEE_GRAPHQL_URL: http://users:8080/query
      ARCEE_HEALTH_URL: http://users:8080/health
      ARCEE_TIMEOUT: ${USERS_TIMEOUT:-5s}
      IRONHIDE_URL: http://entities:8080
      IRONHIDE_TIMEOUT: ${ENTITIES_TIMEOUT:-5s}
      TASKS_IT_URL: http://tasks-it:8080
      TASKS_IT_TIMEOUT: ${TASKS_IT_TIMEOUT:-5s}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-users}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REQUEST_LOG_PATH: ""
    depends_on:
      users:
        condition: service_healthy
      entities:
        condition: service_healthy
      tasks-it:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /graphql
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  content:
    image: alpine:3.22
    profiles: ["future"]
    command: ["sleep", "infinity"]
    healthcheck: { test: ["CMD", "true"] }

  media:
    image: alpine:3.22
    profiles: ["future"]
    command: ["sleep", "infinity"]
    healthcheck: { test: ["CMD", "true"] }

volumes:
  users-postgres:
  entities-postgres:
  tasks-it-postgres:
