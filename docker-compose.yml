name: overmindv

services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  kafka-topics:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${KAFKA_REQUESTS_TOPIC}" --partitions "$${KAFKA_TOPIC_PARTITIONS}" --replication-factor 1 --config "retention.ms=$${KAFKA_RETENTION_MS}"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${KAFKA_RESULTS_TOPIC}" --partitions "$${KAFKA_TOPIC_PARTITIONS}" --replication-factor 1 --config "retention.ms=$${KAFKA_RETENTION_MS}"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${KAFKA_RETRY_TOPIC}" --partitions "$${KAFKA_TOPIC_PARTITIONS}" --replication-factor 1 --config "retention.ms=$${KAFKA_RETENTION_MS}"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${KAFKA_EVENTS_TOPIC}" --partitions "$${KAFKA_TOPIC_PARTITIONS}" --replication-factor 1 --config "retention.ms=$${KAFKA_RETENTION_MS}"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${KAFKA_DEADLETTER_TOPIC}" --partitions "$${KAFKA_TOPIC_PARTITIONS}" --replication-factor 1 --config "retention.ms=$${KAFKA_RETENTION_MS}"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${KAFKA_CONTENT_TOPIC}" --partitions "$${KAFKA_TOPIC_PARTITIONS}" --replication-factor 1 --config "retention.ms=$${KAFKA_RETENTION_MS}"
    environment:
      KAFKA_REQUESTS_TOPIC: ${KAFKA_REQUESTS_TOPIC:-code-execution.requests.v1}
      KAFKA_RESULTS_TOPIC: ${KAFKA_RESULTS_TOPIC:-code-execution.results.v1}
      KAFKA_RETRY_TOPIC: ${KAFKA_RETRY_TOPIC:-code-execution.retry.v1}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-code-execution.events.v1}
      KAFKA_DEADLETTER_TOPIC: ${KAFKA_DEADLETTER_TOPIC:-code-execution.deadletter.v1}
      KAFKA_CONTENT_TOPIC: ${KAFKA_CONTENT_TOPIC:-content.content-item-events}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # kafka-ui — веб-панель для просмотра топиков, consumer-групп, лага и сообщений.
  # Открывается на http://localhost:${KAFKA_UI_PORT:-8086} (никто не должен открывать :29092 в браузере — это TCP-порт брокера).
  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:latest}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8086}:8080"
    restart: unless-stopped

  users-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USERS_POSTGRES_DB:-users}
      POSTGRES_USER: ${USERS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${USERS_POSTGRES_PASSWORD:?set USERS_POSTGRES_PASSWORD in .env}
    ports:
      - "${USERS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - users-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  users-migrate:
    build:
      context: ../users
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://${USERS_POSTGRES_USER:-postgres}:${USERS_POSTGRES_PASSWORD}@users-postgres:5432/${USERS_POSTGRES_DB:-users}?sslmode=disable"
    entrypoint: ["users", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      users-postgres:
        condition: service_healthy
    restart: "no"

  users:
    build:
      context: ../users
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      HTTP_ADDR: ":8080"
      ENV: staging
      LOG_LEVEL: info
      DATABASE_URL: "postgres://${USERS_POSTGRES_USER:-postgres}:${USERS_POSTGRES_PASSWORD}@users-postgres:5432/${USERS_POSTGRES_DB:-users}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-users}
      JWT_TTL: ${JWT_TTL:-24h}
      BOOTSTRAP_SUPERUSER_EMAIL: ${BOOTSTRAP_SUPERUSER_EMAIL:-admin@overmindv.com}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:?set BOOTSTRAP_SUPERUSER_PASSWORD in .env}
      BOOTSTRAP_SUPERUSER_USERNAME: ${BOOTSTRAP_SUPERUSER_USERNAME:-superadmin}
      MEDIA_URL: http://media:8080
      MEDIA_USERS_TOKEN: ${MEDIA_USERS_TOKEN:-${MEDIA_INTERNAL_TOKEN}-users}
      MEDIA_TIMEOUT: ${MEDIA_TIMEOUT:-10s}
      USERS_WORKER_POLL_INTERVAL: ${USERS_WORKER_POLL_INTERVAL:-1s}
    depends_on:
      users-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  entities-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: entities
      POSTGRES_USER: entities
      POSTGRES_PASSWORD: ${ENTITIES_POSTGRES_PASSWORD:?set ENTITIES_POSTGRES_PASSWORD in .env}
    ports:
      - "${ENTITIES_POSTGRES_PORT:-5433}:5432"
    volumes:
      - entities-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entities -d entities"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  entities-migrate:
    build:
      context: ../entities
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://entities:${ENTITIES_POSTGRES_PASSWORD}@entities-postgres:5432/entities?sslmode=disable"
    entrypoint: ["entities", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      entities-postgres:
        condition: service_healthy
    restart: "no"

  entities:
    build:
      context: ../entities
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: entities
      HTTP_ADDR: ":8080"
      ENV: local
      LOG_LEVEL: info
      DATABASE_URL: "postgres://entities:${ENTITIES_POSTGRES_PASSWORD}@entities-postgres:5432/entities?sslmode=disable"
    depends_on:
      entities-migrate:
        condition: service_completed_successfully
    ports:
      - "${ENTITIES_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  tasks-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${TASKS_POSTGRES_PASSWORD:?set TASKS_POSTGRES_PASSWORD in .env}
    ports:
      - "${TASKS_POSTGRES_PORT:-5434}:5432"
    volumes:
      - tasks-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  tasks-migrate:
    build:
      context: ../tasks
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://tasks:${TASKS_POSTGRES_PASSWORD}@tasks-postgres:5432/tasks?sslmode=disable"
    entrypoint: ["tasks", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      tasks-postgres:
        condition: service_healthy
    restart: "no"

  tasks:
    build:
      context: ../tasks
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: tasks
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://tasks:${TASKS_POSTGRES_PASSWORD}@tasks-postgres:5432/tasks?sslmode=disable"
      ENV: local
      READ_TIMEOUT: ${TASKS_READ_TIMEOUT:-10s}
      WRITE_TIMEOUT: ${TASKS_WRITE_TIMEOUT:-20s}
      TASK_HUNTER_INGEST_TOKEN: ${TASK_HUNTER_INGEST_TOKEN:?set TASK_HUNTER_INGEST_TOKEN in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REQUESTS_TOPIC: ${KAFKA_REQUESTS_TOPIC:-code-execution.requests.v1}
      KAFKA_RESULTS_TOPIC: ${KAFKA_RESULTS_TOPIC:-code-execution.results.v1}
      KAFKA_RESULTS_CONSUMER_GROUP: ${KAFKA_RESULTS_CONSUMER_GROUP:-tasks-code-results-v1}
      KAFKA_OUTBOX_POLL_INTERVAL: ${KAFKA_OUTBOX_POLL_INTERVAL:-500ms}
      CODE_EXECUTION_TIME_LIMIT: ${CODE_EXECUTION_TIME_LIMIT:-1s}
      CODE_EXECUTION_MEMORY_LIMIT_BYTES: ${CODE_EXECUTION_MEMORY_LIMIT_BYTES:-67108864}
    depends_on:
      tasks-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # sandbox — исполнитель кода (gojudge/fake): потребляет code-execution.requests.v1
  # из tasks, исполняет код по входным кейсам и публикует результат в results.v1.
  sandbox:
    build:
      context: ../sandbox
      dockerfile: deployments/docker/Dockerfile.worker
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SANDBOX_ENV: local
      SANDBOX_LOG_LEVEL: ${SANDBOX_LOG_LEVEL:-info}
      SANDBOX_KAFKA_BROKERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SANDBOX_KAFKA_GROUP_ID: ${SANDBOX_KAFKA_GROUP_ID:-sandbox-code-execution-v1}
      SANDBOX_KAFKA_TOPIC_REQUESTS: ${KAFKA_REQUESTS_TOPIC:-code-execution.requests.v1}
      SANDBOX_KAFKA_TOPIC_RETRY: ${KAFKA_RETRY_TOPIC:-code-execution.retry.v1}
      SANDBOX_KAFKA_TOPIC_EVENTS: ${KAFKA_EVENTS_TOPIC:-code-execution.events.v1}
      SANDBOX_KAFKA_TOPIC_RESULTS: ${KAFKA_RESULTS_TOPIC:-code-execution.results.v1}
      SANDBOX_KAFKA_TOPIC_DEADLETTER: ${KAFKA_DEADLETTER_TOPIC:-code-execution.deadletter.v1}
      # fake — мгновенный исполнитель без gojudge (по умолчанию); gojudge — реальное исполнение.
      SANDBOX_EXECUTOR_TYPE: ${SANDBOX_EXECUTOR_TYPE:-fake}
      SANDBOX_FEATURE_FAKE_EXECUTOR: ${SANDBOX_FEATURE_FAKE_EXECUTOR:-true}
      SANDBOX_FEATURE_GOJUDGE_EXECUTOR: ${SANDBOX_FEATURE_GOJUDGE_EXECUTOR:-false}
      SANDBOX_GOJUDGE_BASE_URL: http://gojudge:5050
      SANDBOX_STORAGE_TYPE: ${SANDBOX_STORAGE_TYPE:-memory}
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
    ports:
      - "${SANDBOX_HEALTH_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # gojudge — песочница реального исполнения кода (isolate). Опциональна: запускается профилем
  # "gojudge" и требует SANDBOX_EXECUTOR_TYPE=gojudge в .env (а также рантайм-образы языков).
  gojudge:
    profiles: ["gojudge"]
    build:
      context: ../sandbox
      dockerfile: deployments/docker/Dockerfile.gojudge-runtime
      args:
        GOJUDGE_IMAGE: ${SANDBOX_GOJUDGE_IMAGE:-criyle/go-judge:latest}
        GO_RUNTIME_VERSION: 1.26
    privileged: true
    shm_size: 256m
    ports:
      - "${SANDBOX_GOJUDGE_HOST_PORT:-5050}:5050"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5050/version >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  task-hunter-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task_hunter
      POSTGRES_USER: task_hunter
      POSTGRES_PASSWORD: ${TASK_HUNTER_POSTGRES_PASSWORD:?set TASK_HUNTER_POSTGRES_PASSWORD in .env}
    volumes:
      - task-hunter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_hunter -d task_hunter"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  task-hunter-migrate:
    build:
      context: ../task-hunter
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://task_hunter:${TASK_HUNTER_POSTGRES_PASSWORD}@task-hunter-postgres:5432/task_hunter?sslmode=disable"
    entrypoint: ["task-hunter", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      task-hunter-postgres:
        condition: service_healthy
    restart: "no"

  task-hunter:
    build:
      context: ../task-hunter
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      SERVICE_NAME: task-hunter
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://task_hunter:${TASK_HUNTER_POSTGRES_PASSWORD}@task-hunter-postgres:5432/task_hunter?sslmode=disable"
      ENV: local
      PARSER_SCHEDULE_COLLECTCRON: "${TASK_HUNTER_CRON:-0 */6 * * *}"
      PARSER_TASKS_URL: http://tasks:8080
      PARSER_TASKS_TOKEN: ${TASK_HUNTER_INGEST_TOKEN:?set TASK_HUNTER_INGEST_TOKEN in .env}
      PARSER_SECURITY_GATEWAYTOKEN: ${TASK_HUNTER_GATEWAY_TOKEN:?set TASK_HUNTER_GATEWAY_TOKEN in .env}
      PARSER_TELEGRAM_ENABLED: ${TASK_HUNTER_TELEGRAM_ENABLED:-false}
      PARSER_TELEGRAM_APIID: ${TASK_HUNTER_TELEGRAM_API_ID:-0}
      PARSER_TELEGRAM_APIHASH: ${TASK_HUNTER_TELEGRAM_API_HASH:-}
      PARSER_TELEGRAM_SESSIONPATH: /var/lib/task-hunter/telegram.session
      PARSER_TELEGRAM_CHANNELS: ${TASK_HUNTER_TELEGRAM_CHANNELS:-analytic_postupashki,postupashki_ml,algoses}
      PARSER_WORKER_DEFAULTLIMIT: ${TASK_HUNTER_DEFAULT_LIMIT:-100}
      PARSER_WEBSITE_CODEFORCESREADERURL: ${TASK_HUNTER_CODEFORCES_READER_URL:-https://r.jina.ai/http://codeforces.com}
      TELEGRAM_API_ID: ${TASK_HUNTER_TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TASK_HUNTER_TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_2FA_PASSWORD: ${TELEGRAM_2FA_PASSWORD:-}
      TELEGRAM_SESSION_PATH: /var/lib/task-hunter/telegram.session
    volumes:
      - ./.local/task-hunter:/var/lib/task-hunter
    depends_on:
      task-hunter-migrate:
        condition: service_completed_successfully
      tasks:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api-gateway:
    build:
      context: ../api-gateway
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      PORT: "8081"
      USERS_GRAPHQL_URL: http://users:8080/query
      USERS_HEALTH_URL: http://users:8080/health
      USERS_TIMEOUT: ${USERS_TIMEOUT:-5s}
      ENTITIES_URL: http://entities:8080
      ENTITIES_TIMEOUT: ${ENTITIES_TIMEOUT:-5s}
      TASKS_URL: http://tasks:8080
      TASKS_TIMEOUT: ${TASKS_TIMEOUT:-5s}
      TASK_HUNTER_URL: http://task-hunter:8080
      TASK_HUNTER_TOKEN: ${TASK_HUNTER_GATEWAY_TOKEN:?set TASK_HUNTER_GATEWAY_TOKEN in .env}
      TASK_HUNTER_TIMEOUT: ${TASK_HUNTER_TIMEOUT:-10s}
      MEDIA_URL: http://media:8080
      MEDIA_TOKEN: ${MEDIA_GATEWAY_TOKEN:-${MEDIA_INTERNAL_TOKEN}}
      MEDIA_TIMEOUT: ${MEDIA_TIMEOUT:-10s}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-users}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REQUEST_LOG_PATH: ""
    depends_on:
      users:
        condition: service_healthy
      entities:
        condition: service_healthy
      tasks:
        condition: service_healthy
      task-hunter:
        condition: service_healthy
      media:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /graphql
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  content-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${CONTENT_POSTGRES_PASSWORD:?set CONTENT_POSTGRES_PASSWORD in .env}
    ports:
      - "${CONTENT_POSTGRES_PORT:-5436}:5432"
    volumes:
      - content-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  content-migrate:
    build:
      context: ../content
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://content:${CONTENT_POSTGRES_PASSWORD}@content-postgres:5432/content?sslmode=disable"
    entrypoint: ["content", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      content-postgres:
        condition: service_healthy
    restart: "no"

  content:
    build:
      context: ../content
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: content
      HTTP_ADDR: ":8080"
      ENV: local
      LOG_LEVEL: info
      DATABASE_URL: "postgres://content:${CONTENT_POSTGRES_PASSWORD}@content-postgres:5432/content?sslmode=disable"
      GRPC_ADDR: ":9090"
      KAFKA_ENABLED: ${CONTENT_KAFKA_ENABLED:-true}
      KAFKA_TOPIC: ${KAFKA_CONTENT_TOPIC:-content.content-item-events}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    ports:
      - "${CONTENT_GRPC_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  media-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: media
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${MEDIA_POSTGRES_PASSWORD:?set MEDIA_POSTGRES_PASSWORD in .env}
    ports:
      - "${MEDIA_POSTGRES_PORT:-5435}:5432"
    volumes:
      - media-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  media-buckets:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    platform: ${MEDIA_TOOL_PLATFORM:-linux/amd64}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/media-quarantine
        mc mb --ignore-existing local/media
        mc anonymous set download local/media
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ClamAV — антивирус, опциональный. На ряде сетей не может скачать базу сигнатур,
  # поэтому не входит в дефолтный стек и не обязателен для media (проверка деградирует).
  # Включить: docker compose --profile antivirus up -d clamav
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4_base}
    platform: ${MEDIA_TOOL_PLATFORM:-linux/amd64}
    profiles: ["antivirus"]
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\n' | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    mem_limit: 4g
    restart: unless-stopped

  media-migrate:
    build:
      context: ../media
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: "postgres://media:${MEDIA_POSTGRES_PASSWORD}@media-postgres:5432/media?sslmode=disable"
    entrypoint: ["media", "migrate", "--dir", "/app/migrations", "up"]
    depends_on:
      media-postgres:
        condition: service_healthy
    restart: "no"

  media:
    build:
      context: ../media
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      SERVICE_NAME: media
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://media:${MEDIA_POSTGRES_PASSWORD}@media-postgres:5432/media?sslmode=disable"
      ENV: local
      MEDIA_GATEWAY_TOKEN: ${MEDIA_GATEWAY_TOKEN:-${MEDIA_INTERNAL_TOKEN}}
      MEDIA_USERS_TOKEN: ${MEDIA_USERS_TOKEN:-${MEDIA_INTERNAL_TOKEN}-users}
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MEDIA_S3_QUARANTINE_BUCKET: media-quarantine
      MEDIA_S3_MEDIA_BUCKET: media
      MEDIA_S3_PATH_STYLE: "true"
      MEDIA_PUBLIC_BASE_URL: http://localhost:${MINIO_API_PORT:-9000}/media
      MEDIA_CLAMAV_ADDR: clamav:3310
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-5368709120}
      MEDIA_MAX_AVATAR_BYTES: ${MEDIA_MAX_AVATAR_BYTES:-5242880}
      MEDIA_MAX_AVATAR_PIXELS: ${MEDIA_MAX_AVATAR_PIXELS:-12000000}
    depends_on:
      media-migrate:
        condition: service_completed_successfully
      media-buckets:
        condition: service_completed_successfully
    ports:
      - "${MEDIA_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  kafka-data:
  users-postgres:
  entities-postgres:
  tasks-postgres:
  task-hunter-postgres:
  content-postgres:
  media-postgres:
  minio-data:
  clamav-data:
