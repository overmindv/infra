route:
  receiver: team
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: team
    webhook_configs:
      - url_file: /run/alertmanager/webhook-url
        send_resolved: true
        timeout: 10s
        max_alerts: 30
        http_config:
          follow_redirects: false
          authorization:
            credentials_file: /run/alertmanager/webhook-token
