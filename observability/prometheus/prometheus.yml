global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s
  sample_limit: 2000
  label_limit: 12
  label_name_length_limit: 64
  label_value_length_limit: 128
  body_size_limit: 512KB

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: gateway
    follow_redirects: false
    static_configs:
      - targets: [api-gateway:8081]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: gateway_avatar_resolution_failures_total
        action: keep
      - action: labelkeep
        regex: '__name__|job|instance'

  - job_name: core
    follow_redirects: false
    static_configs:
      - targets: [entities:8080, tasks:8080, feed:8080, task-hunter:8080,
                  recommendations:8080, content:8080, media:8080]
    metric_relabel_configs:
      - source_labels: [__name__, route]
        regex: 'parker_ready;|parker_http_(requests_total|request_duration_seconds_(bucket|sum|count));(/v1/(tasks(/\{id\}(/submissions|/code-submissions)?)?|code-submissions/\{id\}|me/code-submissions)|/graphql)'
        action: keep
      - source_labels: [method]
        regex: '|GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS'
        action: keep
      - action: labelkeep
        regex: '__name__|job|instance|service|method|route|status|le'

  - job_name: sandbox
    follow_redirects: false
    file_sd_configs:
      - files: [/run/targets/sandbox.yml]
    relabel_configs:
      - source_labels: [__address__]
        regex: 'sandbox:9090'
        action: keep
      - action: labelkeep
        regex: '__address__|__scheme__|__metrics_path__|__scrape_interval__|__scrape_timeout__|job'
    metric_relabel_configs:
      - source_labels: [__name__, language]
        regex: 'sandbox_(scheduler_(queue_depth|queue_capacity|in_flight|slots_capacity|slots_utilization_percent)|executor_latency_ms_(sum|count));(|python|go)'
        action: keep
      - action: labelkeep
        regex: '__name__|job|instance|language'

  - job_name: tasks-execution
    metrics_path: /internal/metrics/execution
    follow_redirects: false
    authorization:
      credentials_file: /run/monitoring/tasks-token
    file_sd_configs:
      - files: [/run/targets/tasks.yml]
    relabel_configs:
      - source_labels: [__address__]
        regex: 'tasks:8080'
        action: keep
      - target_label: __scheme__
        replacement: http
      - target_label: __metrics_path__
        replacement: /internal/metrics/execution
      - action: labelkeep
        regex: '__address__|__scheme__|__metrics_path__|__scrape_interval__|__scrape_timeout__|job'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'tasks_execution_(queue_oldest_seconds|queue_sample_ok|attempts_total|publish_attempts_total|rejected_results_total|verdicts_total|final_latency_seconds_(bucket|sum|count))'
        action: keep
      - action: labelkeep
        regex: '__name__|job|instance|queue|kind|outcome|reason|run_mode|verdict|le'

  - job_name: recommendations-study
    metrics_path: /internal/metrics/study
    follow_redirects: false
    authorization:
      credentials_file: /run/monitoring/recommendations-token
    file_sd_configs:
      - files: [/run/targets/recommendations.yml]
    relabel_configs:
      - source_labels: [__address__]
        regex: 'recommendations:8080'
        action: keep
      - target_label: __scheme__
        replacement: http
      - target_label: __metrics_path__
        replacement: /internal/metrics/study
      - action: labelkeep
        regex: '__address__|__scheme__|__metrics_path__|__scrape_interval__|__scrape_timeout__|job'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'recommendations_(study_(plan_duration_seconds_(bucket|sum|count)|candidate_checks_total|catalog_state|catalog_synced_timestamp_seconds|ranking_policy_info|auto_adaptation_enabled)|learning_evidence_(lag_seconds_(bucket|sum|count)|committed_total|failures_total))'
        action: keep
      - action: labelkeep
        regex: '__name__|job|instance|operation|result|availability|slot|version|source|stage|le'

  - job_name: host-signals
    follow_redirects: false
    static_configs:
      - targets: [monitoring-signals:9100]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'overmind_(backup_(last_success_timestamp_seconds|last_attempt_timestamp_seconds|last_attempt_ok)|disk_(available_ratio|sample_timestamp_seconds))|node_textfile_scrape_error'
        action: keep
      - action: labelkeep
        regex: '__name__|job|instance'

  - job_name: alertmanager
    follow_redirects: false
    static_configs:
      - targets: [alertmanager:9093]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'alertmanager_notifications_(total|failed_total)'
        action: keep
      - action: labelkeep
        regex: '__name__|job|instance|integration|reason'
