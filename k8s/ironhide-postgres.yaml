apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ironhide-postgres-data
  namespace: overmindv
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironhide-postgres
  namespace: overmindv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ironhide-postgres
  template:
    metadata:
      labels:
        app: ironhide-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ironhide
            - name: POSTGRES_USER
              value: ironhide
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: IRONHIDE_POSTGRES_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U ironhide -d ironhide"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U ironhide -d ironhide"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ironhide-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: ironhide-postgres
  namespace: overmindv
spec:
  selector:
    app: ironhide-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
