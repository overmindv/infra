apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: overmindv
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: kafka-topics
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: kafka-topics
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              attempt=0
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "Kafka не стала доступна за 300 секунд" >&2
                  exit 1
                fi
                sleep 5
              done

              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$KAFKA_REQUESTS_TOPIC" --partitions "$KAFKA_TOPIC_PARTITIONS" --replication-factor 1 --config "retention.ms=$KAFKA_RETENTION_MS"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$KAFKA_RESULTS_TOPIC" --partitions "$KAFKA_TOPIC_PARTITIONS" --replication-factor 1 --config "retention.ms=$KAFKA_RETENTION_MS"
          env:
            - name: KAFKA_REQUESTS_TOPIC
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: KAFKA_REQUESTS_TOPIC } }
            - name: KAFKA_RESULTS_TOPIC
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: KAFKA_RESULTS_TOPIC } }
            - name: KAFKA_TOPIC_PARTITIONS
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: KAFKA_TOPIC_PARTITIONS } }
            - name: KAFKA_RETENTION_MS
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: KAFKA_RETENTION_MS } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
