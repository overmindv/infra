apiVersion: apps/v1
kind: Deployment
metadata:
  name: entities
  namespace: overmindv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entities
  template:
    metadata:
      labels:
        app: entities
    spec:
      initContainers:
        - name: entities-migrate
          image: overmindv/entities:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "goose -dir /app/migrations postgres \"$DATABASE_URL\" up"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: ENTITIES_DATABASE_URL } }
      containers:
        - name: entities
          image: overmindv/entities:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENTITES_SERVICE_NAME
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: ENTITIES_SERVICE_NAME } }
            - name: ENTITES_HTTP_ADDR
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: ENTITIES_HTTP_ADDR } }
            - name: ENTITES_LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: ENTITIES_LOG_LEVEL } }
            - name: ENTITES_ENV
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: ENTITIES_ENV } }
            - name: ENTITES_DATABASE_URL
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: ENTITIES_DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: entities
  namespace: overmindv
spec:
  selector:
    app: entities
  ports:
    - name: http
      port: 8080
      targetPort: http
