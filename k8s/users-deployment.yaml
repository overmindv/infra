apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: overmindv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      initContainers:
        - name: users-migrate
          image: overmindv/users:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - goose -dir /app/migrations postgres "$DATABASE_URL" up
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: USERS_DATABASE_URL } }
      containers:
        - name: users
          image: overmindv/users:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: USERS_PORT } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: USERS_DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: JWT_SECRET } }
            - name: JWT_ISSUER
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: JWT_ISSUER } }
            - name: JWT_TTL
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: JWT_TTL } }
            - name: BOOTSTRAP_SUPERUSER_EMAIL
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: BOOTSTRAP_SUPERUSER_EMAIL } }
            - name: BOOTSTRAP_SUPERUSER_PASSWORD
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: BOOTSTRAP_SUPERUSER_PASSWORD } }
            - name: BOOTSTRAP_SUPERUSER_USERNAME
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: BOOTSTRAP_SUPERUSER_USERNAME } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: overmindv
spec:
  selector:
    app: users
  ports:
    - name: http
      port: 8080
      targetPort: http
