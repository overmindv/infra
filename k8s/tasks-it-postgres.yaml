apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tasks-it-postgres-data
  namespace: overmindv
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-it-postgres
  namespace: overmindv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tasks-it-postgres
  template:
    metadata:
      labels:
        app: tasks-it-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: tasks_it
            - name: POSTGRES_USER
              value: tasks_it
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: TASKS_IT_POSTGRES_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U tasks_it -d tasks_it"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U tasks_it -d tasks_it"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tasks-it-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-it-postgres
  namespace: overmindv
spec:
  selector:
    app: tasks-it-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
