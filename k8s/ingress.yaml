apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: overmindv
spec:
  ingressClassName: nginx
  rules:
    - host: overmindv.local
      http:
        paths:
          - path: /graphql
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081
          - path: /playground
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
