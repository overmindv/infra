apiVersion: v1
kind: ConfigMap
metadata:
  name: overmindv-config
  namespace: overmindv
data:
  ARCEE_PORT: "8080"
  LASERBEAK_PORT: "8081"
  IRONHIDE_HTTP_ADDR: ":8080"
  IRONHIDE_SERVICE_NAME: "ironhide"
  IRONHIDE_LOG_LEVEL: "info"
  IRONHIDE_ENV: "kubernetes"
  IRONHIDE_URL: "http://ironhide:8080"
  IRONHIDE_TIMEOUT: "5s"
  ARCEE_GRAPHQL_URL: "http://arcee:8080/query"
  ARCEE_HEALTH_URL: "http://arcee:8080/health"
  ARCEE_TIMEOUT: "5s"
  JWT_ISSUER: "arcee"
  ADMIN_USER_IDS: ""
  JWT_TTL: "24h"
  BOOTSTRAP_SUPERUSER_USERNAME: "superadmin"
  CORS_ORIGINS: "http://overmindv.local"
