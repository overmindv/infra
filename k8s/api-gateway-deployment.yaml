apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: overmindv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: overmindv/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: API_GATEWAY_PORT } }
            - name: ARCEE_GRAPHQL_URL
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: USERS_GRAPHQL_URL } }
            - name: ARCEE_HEALTH_URL
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: USERS_HEALTH_URL } }
            - name: ARCEE_TIMEOUT
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: USERS_TIMEOUT } }
            - name: IRONHIDE_URL
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: ENTITIES_URL } }
            - name: IRONHIDE_TIMEOUT
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: ENTITIES_TIMEOUT } }
            - name: TASKS_IT_URL
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: TASKS_IT_URL } }
            - name: TASKS_IT_TIMEOUT
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: TASKS_IT_TIMEOUT } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: overmindv-secrets, key: JWT_SECRET } }
            - name: JWT_ISSUER
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: JWT_ISSUER } }
            - name: ADMIN_USER_IDS
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: ADMIN_USER_IDS } }
            - name: CORS_ORIGINS
              valueFrom: { configMapKeyRef: { name: overmindv-config, key: CORS_ORIGINS } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: overmindv
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8081
      targetPort: http
