# Этот пример не подключён к kustomization: deploy-k8s.sh создаёт Secret из окружения.
apiVersion: v1
kind: Secret
metadata:
  name: overmindv-secrets
  namespace: overmindv
type: Opaque
stringData:
  USERS_POSTGRES_PASSWORD: CHANGE_ME
  USERS_DATABASE_URL: CHANGE_ME
  ENTITIES_POSTGRES_PASSWORD: CHANGE_ME
  ENTITIES_DATABASE_URL: CHANGE_ME
  TASKS_IT_POSTGRES_PASSWORD: CHANGE_ME
  TASKS_IT_DATABASE_URL: CHANGE_ME
  JWT_SECRET: CHANGE_ME
  BOOTSTRAP_SUPERUSER_EMAIL: CHANGE_ME
  BOOTSTRAP_SUPERUSER_PASSWORD: CHANGE_ME
