# Schema/example only. deploy-k8s.sh creates this Secret from environment
# variables; this file is intentionally excluded from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: overmindv-secrets
  namespace: overmindv
type: Opaque
stringData:
  POSTGRES_DB: CHANGE_ME
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: CHANGE_ME
  JWT_SECRET: CHANGE_ME
