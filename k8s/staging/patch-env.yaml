apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcee
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: arcee
          env:
            - name: ARCEE_ENV
              value: staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laserbeak
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: laserbeak
          env:
            - name: LASERBEAK_ENV
              value: staging
